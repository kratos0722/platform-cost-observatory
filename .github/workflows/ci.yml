name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify the sample generator runs (does not overwrite committed data)
        run: python scripts/generate_sample.py --out /tmp/cur_check.csv

      - name: Run tests
        run: pytest

      - name: CLI smoke test on committed sample
        run: python -m costobs --input sample_data/cur_sample.csv --json > /tmp/report.json && head -c 400 /tmp/report.json
